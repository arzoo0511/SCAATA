# HANSEI's daily run, on GitHub's servers instead of the laptop.
#
# Runs the agent after each NSE close, then commits its new state (paper book,
# journal, memory) and the day's scored headlines back to main. Streamlit
# Cloud picks up the commit, so hansei.streamlit.app updates on its own.
# Re-running is safe: a session already processed is skipped.
name: HANSEI daily

on:
  schedule:
    # GitHub often starts scheduled runs 5-8 hours late, and after midnight IST
    # Yahoo can't yet see the day that just closed, so the evening runs may
    # skip. The next-day runs catch up; their news stops at the open the
    # orders fill at, so a late run sees nothing a timely one wouldn't.
    - cron: "45 10 * * 1-5"   # 16:15 IST, Mon-Fri: the main run
    - cron: "30 15 * * 1-5"   # 21:00 IST, Mon-Fri: retry
    - cron: "30 2 * * 2-6"    # 08:00 IST next day: catch-up
    - cron: "30 4 * * 2-6"    # 10:00 IST next day: catch-up
    - cron: "30 6 * * 2-6"    # 12:00 IST next day: catch-up
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hansei-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt "groq>=0.29"

      - name: Run HANSEI
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}   # optional: without it, news is scored by keywords
        run: python -m scaata.agent.daily

      - name: Commit and push the new state
        run: |
          git config user.name "hansei-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper_book_india.json forward_test/hansei_journal.json forward_test/hansei_memory.json data_cache/news_india
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "HANSEI daily update"
          git pull --rebase origin main
          git push origin HEAD:main
