# HANSEI brand theme, dark. Surfaces are deepened midnight (#0F414A); text is
# alabaster (#EFE8DF); accents are the brand's light blue and tan. The rest of
# the look lives in scaata/dashboard/ui/theme.py.
[theme]
base = "dark"
primaryColor = "#2F9BB8"
backgroundColor = "#071A1E"
secondaryBackgroundColor = "#0B242A"
textColor = "#EFE8DF"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false
